<!DOCTYPE html>
<html>
<head>
    <title>Vacantes Futuras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<nav class="navbar navbar-custom">
    <div class="container-fluid d-flex align-items-center">

        <img src="{{ url_for('static', filename='img/eoff.png') }}" class="eoff-navbar">

        <h3 class="brand-title">
           ESEASA OFFSHORE
        </h3>

    </div>
</nav>
<body class="bg-light">

<div class="container mt-4">

    <h2>Pipeline de Vacantes</h2>

    <a href="/" class="btn btn-secondary mb-3">← Volver</a>

    <!-- FORMULARIO -->
    <div class="card p-4 mb-4 shadow">
        <h5>Registrar Vacante</h5>

        <form method="POST" action="/guardar_vacante">

            <input type="text" name="puesto" class="form-control mb-2" placeholder="Puesto" required>

            <input type="date" name="fecha" class="form-control mb-2">

            <input type="number" name="cantidad" class="form-control mb-2" placeholder="Cantidad">

            <select name="prioridad" class="form-control mb-2">
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>

            <textarea name="descripcion" class="form-control mb-2" placeholder="Descripción"></textarea>

            <button class="btn btn-primary">Guardar Vacante</button>
        </form>
    </div>

    <!-- TABLA -->
    <div class="card p-3 shadow">
        <h5>Vacantes registradas</h5>

        <table class="table table-hover table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Puesto</th>
                    <th>Fecha</th>
                    <th>Cantidad</th>
                    <th>Prioridad</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                    <th>Candidatos</th>
                    <th>Ver</th>
                </tr>
            </thead>

            <tbody>
                {% for v in vacantes %}
                <tr>
                    <td>{{ v[1] }}</td>
                    <td>{{ v[2] }}</td>
                    <td>{{ v[3] }}</td>
                    <td>{{ v[4] }}</td>
                    <td>{{ v[5] }}</td>
                    <td>
                     <a href="/sugerir/{{ v[0] }}" class="btn btn-success btn-sm">Ver candidatos</a>
                    </td>

                    <td>
                     <span class="badge bg-primary">{{ v[6] }}</span>
                    </td>
                    
                    <td>
                    <a href="/ver_asignados/{{ v[0] }}" class="btn btn-dark btn-sm">
                       Ver
                    </a>
</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
