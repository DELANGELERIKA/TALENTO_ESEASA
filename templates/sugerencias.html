<!DOCTYPE html>
<html>
<head>
    <title>Candidatos sugeridos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<nav class="navbar navbar-custom">
    <div class="container-fluid d-flex align-items-center">

        <img src="{{ url_for('static', filename='img/eoff.png') }}" class="eoff-navbar">

        <h3 class="brand-title">
            ESEASA OFFSHORE
        </h3>

    </div>
</nav>
<body class="bg-light">

<div class="container mt-4">

    <h3>Candidatos sugeridos para: {{ vacante[1] }}</h3>

    <a href="/vacantes" class="btn btn-secondary mb-3">← Volver</a>

    <table class="table table-hover table-bordered bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Ciudad</th>
                <th>Asignar</th>
            </tr>
        </thead>

        <tbody>
            {% for c in candidatos %}
            <tr>
                <td>{{ c[1] }}</td>
                <td>{{ c[7] }}</td>
                <td>{{ c[4] }}</td>
                <td>
                    <a href="/asignar/{{ c[0] }}/{{ vacante[0] }}" class="btn btn-primary btn-sm">
                        Asignar
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
