<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Talento
    </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        body {
            background-color: white;
        }
        .navbar {
            background-color: #4387e7f5;
        }
        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }
        .card {
            border-radius: 15px;
        }
        .btn {
            border-radius: 10px;
        }
        table {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>

</head>
<nav class="navbar navbar-custom">
    <div class="container-fluid d-flex align-items-center">

        <img src="{{ url_for('static', filename='img/eoff.png') }}" class="eoff-navbar">

        <h3 class="brand-title">
            CANDIDATOS - ESEASA OFFSHORE
        </h3>

    </div>
</nav>
<body>

<!-- 🔵 NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a href="/vacantes" class="btn btn-light">📊 Vacantes futuras</a>
        <a href="/logout" class="btn btn-light"> Cerrar sesión</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- 🔍 BUSCADOR -->
    <div class="card p-3 mb-4 shadow-sm">
        <form method="GET" action="/">
            <div class="input-group">
                <input type="text" name="busqueda" class="form-control" placeholder="🔍 Buscar por nombre, ciudad o especialidad">
                <button class="btn btn-primary">Buscar</button>
            </div>
        </form>
    </div>

    <!-- 📝 FORMULARIO -->
    <div class="card p-4 mb-4 shadow">
        <h5 class="mb-3">Registrar Candidato</h5>

        <form method="POST" action="/guardar" enctype="multipart/form-data">

            <div class="row">
                <div class="col-md-6 mb-2">
                    <input type="text" name="nombre" class="form-control" placeholder="Nombre" required>
                </div>
                <div class="col-md-6 mb-2">
                    <input type="text" name="telefono" class="form-control" placeholder="Teléfono">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-2">
                    <input type="email" name="correo" class="form-control" placeholder="Correo">
                </div>
                <div class="col-md-6 mb-2">
                    <input type="text" name="ciudad" class="form-control" placeholder="Ciudad">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-2">
                    <input type="text" name="escolaridad" class="form-control" placeholder="Escolaridad">
                </div>
                <div class="col-md-6 mb-2">
                    <input type="text" name="especialidad" class="form-control" placeholder="Especialidad">
                </div>
            </div>

            <div class="mb-2">
                <select name="disponibilidad" class="form-control">
                    <option value="Inmediata">Disponibilidad: Inmediata</option>
                    <option value="15 días">15 días</option>
                    <option value="1 mes">1 mes</option>
                </select>
            </div>

            <div class="mb-3">
                <input type="file" name="cv" class="form-control">
            </div>

            <button class="btn btn-primary">Guardar Candidato</button>

        </form>
    </div>

    <!-- 📊 TABLA -->
    <div class="card p-3 shadow">
        <h5 class="mb-3">Lista de Candidatos</h5>

        <div class="table-responsive">
            <table class="table table-hover table-bordered bg-white shadow-sm">

                <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Ciudad</th>
                        <th>Especialidad</th>
                        <th>Disponibilidad</th>
                        <th>CV</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    {% for c in candidatos %}
                    <tr>
                        <td>{{ c[1] }}</td>
                        <td>{{ c[4] }}</td>
                        <td>{{ c[7] }}</td>
                        <td>
                            <span class="badge bg-success">{{ c[8] }}</span>
                        </td>

                        <td>
                            {% if c[10] %}
                                <a href="{{ c[10] }}" target="_blank" class="btn btn-sm btn-info">CV</a>
                            {% else %}
                                <span class="text-muted">No</span>
                            {% endif %}
                        </td>

                        <td>
                            <a href="/editar/{{ c[0] }}" class="btn btn-warning btn-sm">✏️</a>
                            <a href="/eliminar/{{ c[0] }}" class="btn btn-danger btn-sm">🗑️</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>
    </div>

</div>

</body>
</html>
